[data-theme="dark"]{--azul-mariano:#e8a7ac;--azul-mariano-2:#c97b83;--azul-claro:#2b1c17;--dourado:#e0c26e;--dourado-claro:#3a3320;--branco:#1c1210;--texto:#eef2ff;--texto-suave:#b7c0d4;--sombra:0 10px 30px rgba(0,0,0,0.45);--bg-grad:linear-gradient(160deg,#170d0a 0%,#1f1310 50%,#150c09 100%);--card-bg:#221512;--header-grad:linear-gradient(120deg,#2b0c10 0%,#4a0f18 55%,#6b1a26 100%);}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:'Georgia','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg-grad);color:var(--texto);min-height:100vh;transition:background .4s ease,color .4s ease;padding-bottom:60px;}
.ornamento{position:fixed;opacity:.06;pointer-events:none;z-index:0;}
[data-theme="dark"] .ornamento{opacity:.08;}
.orn-1{top:-60px;right:-60px;width:260px;}.orn-2{bottom:-40px;left:-60px;width:220px;}
header{position:relative;background:var(--header-grad);color:#fff;padding:52px 20px 90px;text-align:center;overflow:hidden;box-shadow:var(--sombra);}
header::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.08) 0,transparent 35%),radial-gradient(circle at 85% 75%,rgba(255,255,255,.07) 0,transparent 40%);}
.estrela-topo{width:34px;height:34px;margin:0 auto 14px;opacity:.95;}
header h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.5px;font-weight:600;position:relative;}
header .subtitulo{font-size:1rem;color:var(--dourado-claro);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;position:relative;}
header .versiculo{font-style:italic;color:rgba(255,255,255,.85);max-width:560px;margin:14px auto 0;font-size:.95rem;position:relative;}
.linha-dourada{width:90px;height:3px;background:linear-gradient(90deg,transparent,var(--dourado),transparent);margin:18px auto 0;position:relative;}
.painel-controles{max-width:980px;margin:-55px auto 30px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--sombra);padding:22px 24px;position:relative;z-index:5;border:1px solid rgba(201,162,75,.25);}
.linha-controles{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.campo-busca{flex:1 1 240px;position:relative;}
.campo-busca input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:1.5px solid rgba(122,31,43,.18);background:var(--azul-claro);color:var(--texto);font-size:.95rem;outline:none;transition:border .25s,box-shadow .25s;}
.campo-busca input:focus{border-color:var(--dourado);box-shadow:0 0 0 3px rgba(201,162,75,.2);}
.campo-busca .icone-busca{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.55;}
select{padding:11px 14px;border-radius:999px;border:1.5px solid rgba(122,31,43,.18);background:var(--azul-claro);color:var(--texto);font-size:.9rem;cursor:pointer;outline:none;}
.botoes-acao{display:flex;gap:10px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;border:none;background:var(--azul-mariano);color:#fff;font-size:.85rem;cursor:pointer;transition:transform .2s,box-shadow .2s;font-weight:500;}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(122,31,43,.25);}
.btn.dourado{background:linear-gradient(120deg,var(--dourado),#b8933f);color:#3a2c05;}
.btn.outline{background:transparent;border:1.5px solid var(--azul-mariano-2);color:var(--azul-mariano-2);}
[data-theme="dark"] .btn.outline{color:var(--azul-mariano);border-color:var(--azul-mariano);}
.contagem-resultados{text-align:center;color:var(--texto-suave);font-size:.85rem;margin-top:14px;letter-spacing:.3px;}
main{max-width:980px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}
.bloco-local{margin-bottom:46px;}
.titulo-local{display:flex;align-items:center;gap:12px;margin:34px 0 20px;}
.titulo-local h2{font-size:1.3rem;color:var(--azul-mariano);margin:0;font-weight:600;}
.titulo-local .icone-igreja{width:26px;height:26px;flex-shrink:0;color:var(--dourado);}
.titulo-local::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,75,.5),transparent);}
.grade-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--sombra);padding:22px;border:1px solid rgba(201,162,75,.18);position:relative;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease;}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(122,31,43,.18);}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--azul-mariano),var(--dourado),var(--azul-mariano-2));}
.card-data{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-data .dia-mes{font-size:1.6rem;font-weight:700;color:var(--azul-mariano);line-height:1;}
.card-data .dia-semana{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--dourado);margin-top:4px;font-weight:600;}
.selo-mes{font-size:.68rem;color:var(--texto-suave);background:var(--azul-claro);padding:4px 10px;border-radius:999px;white-space:nowrap;}
.celebracao{font-size:.85rem;color:var(--texto-suave);font-style:italic;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed rgba(201,162,75,.35);}
.horario-item{margin-bottom:14px;}.horario-item:last-child{margin-bottom:0;}
.horario-cabecalho{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.badge-hora{background:var(--azul-mariano);color:#fff;font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:999px;letter-spacing:.4px;}
.lista-servidores{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.lista-servidores li{display:flex;align-items:center;gap:9px;font-size:.88rem;padding:6px 10px;background:var(--azul-claro);border-radius:10px;}
.avatar-inicial{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--dourado),var(--azul-mariano-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;}
.nome-servidor{font-weight:600;color:var(--texto);}
.funcao-servidor{color:var(--texto-suave);font-size:.76rem;}
.a-definir .avatar-inicial{background:#b0b8c4;}
.a-definir .nome-servidor{color:var(--texto-suave);font-style:italic;font-weight:500;}
.evento-especial{background:var(--dourado-claro);color:#6b5417;padding:10px 12px;border-radius:10px;font-size:.85rem;font-weight:600;text-align:center;}
[data-theme="dark"] .evento-especial{color:#e9d48f;}
.card.oculto{display:none;}
.destaque{background:rgba(201,162,75,.35);border-radius:3px;padding:0 2px;}
footer{text-align:center;padding:40px 20px 10px;color:var(--texto-suave);font-size:.8rem;}
footer .frase{font-style:italic;color:var(--azul-mariano-2);margin-bottom:8px;font-size:.9rem;}
.toggle-tema{position:fixed;top:20px;right:20px;z-index:20;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
@media print{.toggle-tema,.painel-controles,header .versiculo,.estrela-topo,.ornamento{display:none!important;}body{background:#fff!important;}header{background:#7a1f2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:20px;}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}.grade-cards{grid-template-columns:repeat(2,1fr);}main{max-width:100%;}}
@media (max-width:560px){header{padding:40px 16px 80px;}.linha-controles{flex-direction:column;align-items:stretch;}.grade-cards{grid-template-columns:1fr;}}

</style>
</head>

function destacarTexto(texto, termo){ const seguro = escapeHtml(texto); if(!termo) return seguro; const regex = new RegExp('('+termo.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return seguro.replace(regex, '<span class="destaque">$1</span>'); }
const ICONE_IGREJA = '<svg class="icone-igreja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 L12 6"/><path d="M9 4 L15 4"/><path d="M4 21 L4 11 L12 6 L20 11 L20 21 Z"/><path d="M9 21 L9 15 L15 15 L15 21"/><circle cx="12" cy="10.5" r="1.2" fill="currentColor" stroke="none"/></svg>';
function renderizarServidor(s, termo){ const definir = (s.nome||'').includes('DEFINIR') || !s.nome; const nomeShow = definir ? 'A definir' : s.nome; return '<li class="'+(definir?'a-definir':'')+'"><span class="avatar-inicial">'+iniciais(s.nome)+'</span><span><span class="nome-servidor">'+destacarTexto(nomeShow, termo)+'</span><span class="funcao-servidor"> · '+escapeHtml(s.funcao||'')+'</span></span></li>'; }
function renderizarCard(local, evento, termo){
  const dia = diaNumeroDe(evento.data), diaSemana = diaSemanaDe(evento.data), mesAbrev = mesAbrevDe(evento.data);
  const horariosHtml = evento.horarios.map(h => {
    if(h.especial){ return '<div class="horario-item"><div class="horario-cabecalho"><span class="badge-hora">'+(h.hora||'--:--')+'</span></div><div class="evento-especial">✦ '+escapeHtml(h.especialTexto||'Evento especial')+'</div></div>'; }
    const sv = h.servidores.map(s => renderizarServidor(s, termo)).join('');
    return '<div class="horario-item"><div class="horario-cabecalho"><span class="badge-hora">'+(h.hora||'--:--')+'</span></div><ul class="lista-servidores">'+sv+'</ul></div>';
  }).join('');
  const celeb = evento.celebracao ? '<div class="celebracao">'+escapeHtml(evento.celebracao)+'</div>' : '';
  const nomesBusca = evento.horarios.flatMap(h => (h.servidores||[]).map(s=>s.nome||'')).join(', ').toLowerCase();
  const horas = evento.horarios.map(h => h.hora).join('|');
  return '<div class="card" data-local="'+escapeHtml(local.nome)+'" data-dia="'+diaSemana+'" data-horas="'+horas+'" data-nomes="'+escapeHtml(nomesBusca)+'"><div class="card-data"><div><span class="dia-mes">'+dia+'</span><span class="dia-semana">'+(diaSemana||'—')+'</span></div><span class="selo-mes">'+mesAbrev+'</span></div>'+celeb+horariosHtml+'</div>';
}
function renderizarTudo(){
  const container = document.getElementById('conteudo');
  container.innerHTML = DADOS_LOCAIS.map(local => {
    if(!local.eventos || local.eventos.length===0) return '';
    return '<section class="bloco-local"><div class="titulo-local">'+ICONE_IGREJA+'<h2>'+escapeHtml(local.nome)+'</h2></div><div class="grade-cards">'+local.eventos.map(e => renderizarCard(local, e, '')).join('')+'</div></section>';
  }).join('');
}
function popularFiltros(){
  const selLocal = document.getElementById('filtroLocal');
  DADOS_LOCAIS.forEach(l => { const opt = document.createElement('option'); opt.value = l.nome; opt.textContent = l.nome; selLocal.appendChild(opt); });
  const dias = [...new Set(DADOS_LOCAIS.flatMap(l => l.eventos.map(e => diaSemanaDe(e.data))))];
  const selDia = document.getElementById('filtroDia');
  dias.forEach(d => { const opt = document.createElement('option'); opt.value = d; opt.textContent = d; selDia.appendChild(opt); });
  const horarios = [...new Set(DADOS_LOCAIS.flatMap(l => l.eventos.flatMap(e => e.horarios.map(h => h.hora))))].sort();
  const selHora = document.getElementById('filtroHorario');
  horarios.forEach(h => { const opt = document.createElement('option'); opt.value = h; opt.textContent = h; selHora.appendChild(opt); });
}
function aplicarFiltros(){
  const termo = document.getElementById('busca').value.trim().toLowerCase();
  const local = document.getElementById('filtroLocal').value;
  const dia = document.getElementById('filtroDia').value;
  const horario = document.getElementById('filtroHorario').value;
  const cards = document.querySelectorAll('.card');
  let visiveis = 0;
  cards.forEach(card => {
    const nomes = card.getAttribute('data-nomes')||'';
    const horas = (card.getAttribute('data-horas')||'').split('|');
    const mostrar = (!termo || nomes.includes(termo)) && (local==='todos'||card.getAttribute('data-local')===local) && (dia==='todos'||card.getAttribute('data-dia')===dia) && (horario==='todos'||horas.includes(horario));
    card.classList.toggle('oculto', !mostrar);
    if(mostrar) visiveis++;
  });
  document.querySelectorAll('.bloco-local').forEach(sec => { const tem = [...sec.querySelectorAll('.card')].some(c=>!c.classList.contains('oculto')); sec.style.display = tem?'':'none'; });
  document.getElementById('contagem').textContent = visiveis===0 ? 'Nenhuma celebração encontrada com esses filtros.' : visiveis+' celebração(ões) encontrada(s)';
  if(termo){ document.querySelectorAll('.card:not(.oculto) .nome-servidor').forEach(el=>{ el.innerHTML = destacarTexto(el.textContent, termo); }); }
  else{ document.querySelectorAll('.card .nome-servidor').forEach(el=>{ el.textContent = el.textContent; }); }
}
const ICONE_SOL = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5a1 1 0 011 1V7a1 1 0 11-2 0V5.5a1 1 0 011-1zm0 12a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm7.5-4.5a1 1 0 011 1 1 1 0 01-1 1H18a1 1 0 110-2h1.5zM6 13a1 1 0 011 1 1 1 0 01-1 1H4.5a1 1 0 110-2H6zm11.03-5.53a1 1 0 011.42 0 1 1 0 010 1.42l-.71.7a1 1 0 11-1.41-1.4l.7-.72zM6.66 17.24a1 1 0 011.41 0 1 1 0 010 1.42l-.7.7a1 1 0 11-1.42-1.41l.71-.71zM12 17.5a1 1 0 011 1V20a1 1 0 11-2 0v-1.5a1 1 0 011-1zm5.03 1.24a1 1 0 011.42 1.41l-.71.71a1 1 0 01-1.41-1.42l.7-.7zM6.66 6.76a1 1 0 01-1.41-1.42l.7-.7a1 1 0 111.42 1.4l-.71.72z"/></svg>';
const ICONE_LUA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-5.4-5.4c0-1.81.91-3.4 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>';
document.getElementById('btnTema').addEventListener('click', () => {
  const body = document.body; const novo = body.getAttribute('data-theme')==='light'?'dark':'light';
  body.setAttribute('data-theme', novo);
  document.getElementById('iconeTema').outerHTML = (novo==='dark'?ICONE_SOL:ICONE_LUA).replace('<svg ', '<svg id="iconeTema" ');
});
document.getElementById('busca').addEventListener('input', aplicarFiltros);
document.getElementById('filtroLocal').addEventListener('change', aplicarFiltros);
document.getElementById('filtroDia').addEventListener('change', aplicarFiltros);
document.getElementById('filtroHorario').addEventListener('change', aplicarFiltros);
document.getElementById('btnLimpar').addEventListener('click', () => { document.getElementById('busca').value=''; document.getElementById('filtroLocal').value='todos'; document.getElementById('filtroDia').value='todos'; document.getElementById('filtroHorario').value='todos'; aplicarFiltros(); });
document.getElementById('btnImprimir').addEventListener('click', () => window.print());
document.getElementById('btnPdf').addEventListener('click', () => window.print());
renderizarTudo(); popularFiltros(); aplicarFiltros();

</script>
</body>
</html>
